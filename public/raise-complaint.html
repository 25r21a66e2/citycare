<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raise Complaint | CityCare</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="/">🏙️ CityCare</a><nav><a href="/raise-complaint.html">Raise Complaint</a><a href="/track-complaint.html">Track</a><a href="/admin.html">Admin</a></nav></header><main class="form-page"><a class="back" href="/">← Home</a><span class="eyebrow">LET US KNOW</span><h1>Raise a complaint</h1><p class="muted">Share the details below. Fields marked * are required.</p><form id="complaint-form" class="panel"><div class="form-grid"><label>Full name *<input name="name" required maxlength="100" placeholder="Your name"></label><label>Phone number<input name="phone" type="tel" maxlength="20" placeholder="Optional contact number"></label><label>Issue category *<select name="category" required><option value="">Choose a category</option><option>Roads & potholes</option><option>Water supply</option><option>Garbage & sanitation</option><option>Street lights</option><option>Drainage</option><option>Public safety</option><option>Other</option></select></label><label>Location / address *<input name="address" required maxlength="250" placeholder="Street, area, landmark"></label><label class="full">Describe the issue *<textarea name="description" required rows="5" maxlength="2000" placeholder="What happened? Add useful details..."></textarea></label></div><div class="location-row"><button class="btn secondary" id="gps-btn" type="button">📍 Use my location</button><span id="gps-note" class="muted small">Optional. Your browser will ask permission.</span></div><input type="hidden" name="latitude"><input type="hidden" name="longitude"><button class="btn" type="submit">Submit complaint →</button><p id="form-message" role="status"></p></form></main><footer>© <span id="year"></span> CityCare</footer><script src="raise.js"></script></body></html>
